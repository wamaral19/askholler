# Render Blueprint. See docs/deployment.md before applying.
#
# Secrets marked `sync: false` are entered in the Render dashboard; Render
# prompts only when a service is first created, so add new ones by hand. Until
# they are set, the workforce pages and the worker fail closed (packages/domain/src/
# config.ts) while the landing page and Shopify webhooks keep working.

databases:
  - name: holler-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "17"
    databaseName: holler
    # Reachable only from services in this Render account.
    ipAllowList: []

services:
  - type: web
    name: holler-web
    runtime: node
    plan: starter
    region: virginia
    # Deploy only from main, and only after GitHub CI passes for the commit.
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build --workspace=@holler/web
    preDeployCommand: npm run db:migrate
    startCommand: npm run start --workspace=@holler/web
    healthCheckPath: /
    domains:
      - withholler.com
      - app.withholler.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: holler-db
          property: connectionString
      - key: HOLLER_MARKETING_URL
        value: https://withholler.com
      - key: APP_BASE_URL
        value: https://app.withholler.com
      - key: SHOPIFY_APP_URL
        value: https://app.withholler.com
      # Public client ID, also in shopify.app.toml.
      - key: SHOPIFY_API_KEY
        value: 44aa3b7648ef2fd87327306c7035e3ae
      # Workforce operations: real (non-synthetic) data, Google sign-in.
      - key: HOLLER_OPERATIONS_MODE
        value: postgres
      - key: WORKFORCE_AUTH_PROVIDER
        value: oidc
      - key: OIDC_ISSUER
        value: https://accounts.google.com
      - key: WORKFORCE_ALLOWED_DOMAIN
        value: withholler.com
      - key: DIALER_PROVIDER
        value: twilio
      - key: OBJECT_STORE_PROVIDER
        value: r2
      # Service-account key uploaded as a Render secret file named gcp-kms.json.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcp-kms.json
      # Secrets: entered in the Render dashboard, never committed.
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: PII_KMS_KEY_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      - key: TWILIO_CALLER_ID
        sync: false
      - key: TWILIO_CALL_INTENT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: holler-production-private

  # Runs qualification, report rendering, and the hourly privacy sweep.
  - type: worker
    name: holler-worker
    runtime: node
    plan: starter
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev
    startCommand: npm run start --workspace=@holler/worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: holler-db
          property: connectionString
      # The privacy sweep deletes recordings from R2 and Twilio. Enter the
      # same values as on holler-web (env groups cannot hold sync: false).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: holler-production-private
